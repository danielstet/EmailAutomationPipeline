site_name: Email Automation Pipeline
site_description: Local mail server + LangGraph/LangChain/Ollama pipeline for automated email triage
repo_url: https://github.com/danielstet/EmailAutomationPipeline

# Not a real page — just the source for the abbreviations glossary, appended
# into every page via pymdownx.snippets below. Exclude it from the nav/search.
exclude_docs: |
  includes/

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - content.tooltips

markdown_extensions:
  - admonition
  - abbr
  - pymdownx.details
  - pymdownx.snippets:
      base_path: docs/includes
      check_paths: true
      auto_append:
        - abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Mail Server:
      - Getting Started: mail-server/getting-started.md
      - Accounts & Webmail: mail-server/accounts-and-webmail.md
      - Architecture Notes: mail-server/architecture-notes.md
  - Pipeline:
      - Overview: pipeline/overview.md
