services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.localmail.test
    env_file: mailserver.env
    ports:
      - "25:25"    # SMTP   (server-to-server, explicit TLS)
      - "143:143"  # IMAP4  (explicit TLS => STARTTLS)
      - "465:465"  # ESMTP  (implicit TLS submission)
      - "587:587"  # ESMTP  (explicit TLS submission => STARTTLS)
      - "993:993"  # IMAP4  (implicit TLS)
    volumes:
      # Bind-mounted inside the repo so mail data/config/certs are identical
      # for everyone who clones this project — no external volume setup.
      - ./docker-data/dms/mail-data/:/var/mail/
      - ./docker-data/dms/mail-logs/:/var/log/mail/
      - ./docker-data/dms/config/:/tmp/docker-mailserver/
      - /etc/localtime:/etc/localtime:ro
      # mail-state is Postfix's runtime queue/locks/sockets, not real mail
      # data — it must be a Docker-managed volume, not a bind mount. On
      # Docker Desktop for Mac, bind-mounting it breaks Postfix's private
      # sockets ("chmod socket private/smtpd: Invalid argument") because
      # Unix domain sockets don't survive the macOS<->Linux-VM filesystem
      # bridge. See: docker-mailserver/docker-mailserver#3648
      - mail-state:/var/mail-state/
    restart: unless-stopped
    stop_grace_period: 1m
    networks:
      default:
        # So other containers (e.g. roundcube) can reach this server by the
        # exact hostname our self-signed cert's SAN covers. Connecting via
        # the plain service name "mailserver" instead would fail TLS
        # hostname verification.
        aliases:
          - mail.localmail.test

  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: roundcube
    depends_on:
      - mailserver
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=tls://mail.localmail.test
      - ROUNDCUBEMAIL_DEFAULT_PORT=143
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mail.localmail.test
      - ROUNDCUBEMAIL_SMTP_PORT=587
      # Self-signed CA, not a public one — ignore cert warnings, this is a
      # LAN-only test rig.
      - ROUNDCUBEMAIL_SKIN=elastic
    ports:
      - "8080:80"
    volumes:
      # Persists Roundcube's own SQLite DB (saved settings, address book —
      # not mail itself, that always lives on the mailserver).
      - ./docker-data/roundcube/db/:/var/roundcube/db/
      # Skip TLS peer verification against our self-signed cert (see file).
      - ./docker-data/roundcube/config/:/var/roundcube/config/
    restart: unless-stopped

volumes:
  mail-state:
