services:
  stalwart:
    build: .
    image: local-stalwart
    container_name: stalwart
    init: true
    restart: unless-stopped
    environment:
      # Fixes the bootstrap admin login instead of a random per-machine
      # password, so every teammate who pulls this repo logs into their
      # own first-run wizard with the same known credentials.
      # Test-only LAN server — do not reuse this password anywhere real.
      - STALWART_RECOVERY_ADMIN=admin:StalwartLAN2026!
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "995:995"
      - "4190:4190"
      - "443:443"
      # Bound to all interfaces (not just 127.0.0.1) so other devices on your
      # LAN can reach the setup wizard at http://<this-host-LAN-IP>:8080/admin.
      # The wizard has no brute-force protection — fine on a trusted local
      # network for testing, never on an internet-facing host.
      - "8080:8080"
    volumes:
      # Bind-mounted inside the repo (not Docker-managed named volumes) so the
      # config/data path is identical for everyone who clones this project —
      # no per-machine volume setup required.
      - ./data/etc:/etc/stalwart
      - ./data/data:/var/lib/stalwart
